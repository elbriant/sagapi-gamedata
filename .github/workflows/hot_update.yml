name: Gamedata Hot Update Check

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      server:
        description: 'Target server to check'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cn
          - en
          - jp
          - kr
          - tw

# Serialize with the App Update workflow: both write to the same gamedata
# branch. With max-parallel: 1 below, the matrix jobs themselves are also
# sequential, so each one checks out the latest branch before committing.
concurrency:
  group: gamedata-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.matrix.outputs.servers }}
    steps:
      - name: Build server matrix
        id: matrix
        run: |
          set -euo pipefail
          SERVER="${{ github.event.inputs.server || 'all' }}"
          case "$SERVER" in
            all|cn|en|jp|kr|tw) ;;
            *)
              echo "::error::Invalid server '$SERVER'"
              exit 1
              ;;
          esac
          if [ "$SERVER" = "all" ]; then
            echo 'servers=["cn","en","jp","kr","tw"]' >> "$GITHUB_OUTPUT"
          else
            echo "servers=[\"$SERVER\"]" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.servers) }}
    uses: ./.github/workflows/update_server.yml
    with:
      server: ${{ matrix.server }}
      force: false
      commit_label: 'Hot Update'
