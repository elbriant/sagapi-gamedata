name: Gamedata Hot Update Check

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      server:
        description: 'Target server to check'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cn
          - en
          - jp
          - kr
          - tw

jobs:
  check_hot_updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main code
        uses: actions/checkout@v4
        with:
          path: main_repo

      - name: Checkout gamedata branch
        uses: actions/checkout@v4
        with:
          ref: gamedata
          path: gamedata_branch

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Fetch Dependencies
        run: dart pub get
        working-directory: main_repo

      - name: Execute Gamedata Hot Update Check
        run: |
          SERVER="${{ github.event.inputs.server || 'all' }}"
          dart run bin/sagapi_gamedata.dart --server $SERVER --bundles-path ../gamedata_tmp_bundles --out-path ../gamedata_branch --failfast
        working-directory: main_repo

      - name: Commit and Push to gamedata branch
        working-directory: gamedata_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          SERVER="${{ github.event.inputs.server || 'all' }}"
          CURRENT_DATE=$(date +'%Y-%m-%d %H:%M')
          COMMIT_MSG="Auto-update Gamedata (Hot Update) | Server: $SERVER | Date: $CURRENT_DATE"
          
          git diff-index --quiet HEAD || git commit -m "$COMMIT_MSG"
          git push origin gamedata