name: Gamedata App Update (From FBS)

on:
  # Contract with sagapi-flatbuffers:
  #   event_type: fbs_updated
  #   client_payload.server: all | cn | en | jp | kr | tw
  #
  # The sender does NOT target a workflow file. Any workflow in this repository
  # with `on.repository_dispatch.types: [fbs_updated]` receives the event.
  # This file is the only listener; the reusable update_server.yml is invoked
  # internally through `uses`, not triggered by the dispatch.
  repository_dispatch:
    types: [fbs_updated]
  workflow_dispatch:
    inputs:
      server:
        description: 'Target server to update'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cn
          - en
          - jp
          - kr
          - tw

concurrency:
  group: gamedata-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.matrix.outputs.servers }}
    steps:
      - name: Build server matrix
        id: matrix
        run: |
          set -euo pipefail
          SERVER="${{ github.event.client_payload.server || github.event.inputs.server || 'all' }}"
          # Defensive normalization: some senders use "global" to mean the
          # EN/JP/KR schema set. The gamedata pipeline handles it as "all".
          if [ "$SERVER" = "global" ]; then
            SERVER="all"
          fi
          case "$SERVER" in
            all|cn|en|jp|kr|tw) ;;
            *)
              echo "::error::Invalid server '$SERVER'"
              exit 1
              ;;
          esac
          if [ "$SERVER" = "all" ]; then
            echo 'servers=["cn","en","jp","kr","tw"]' >> "$GITHUB_OUTPUT"
          else
            echo "servers=[\"$SERVER\"]" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.servers) }}
    uses: ./.github/workflows/update_server.yml
    with:
      server: ${{ matrix.server }}
      force: true
      commit_label: 'App Update'
